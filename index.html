<style>
  html.bs-lock, html.bs-lock body { overflow: hidden; }
  html.bs-skip #briu-splash { display: none; }

  #briu-splash {
    --bs-navy: #0B1325; --bs-blue: #2563eb; --bs-sky: #3b82f6;
    position: fixed; inset: 0; z-index: 99999; overflow: hidden; color: #fff;
    font-family: 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  #briu-splash * { box-sizing: border-box; }

  /* two curtain halves: they split open at the end */
  #briu-splash .bs-panel { position: absolute; left: 0; right: 0; height: 50.2%; background: var(--bs-navy); transition: transform .85s cubic-bezier(.76, 0, .24, 1) .38s; will-change: transform; }
  #briu-splash .bs-top { top: 0; border-bottom: 1px solid rgba(59,130,246,.55); }
  #briu-splash .bs-bot { bottom: 0; border-top: 1px solid rgba(59,130,246,.55); }

  /* stadium light beams + glow */
  #briu-splash .bs-fx { position: absolute; inset: 0; transition: opacity .45s ease; pointer-events: none; }
  #briu-splash .bs-glow { position: absolute; inset: 0; background: radial-gradient(55% 55% at 50% 42%, rgba(37,99,235,.38), transparent 70%); animation: bsBreathe 3.2s ease-in-out infinite; }
  #briu-splash .bs-beams { position: absolute; left: -60%; right: -60%; top: -60%; bottom: -60%; animation: bsSpin 18s linear infinite;
    background: conic-gradient(from 0deg at 50% 50%, transparent 0 18deg, rgba(59,130,246,.20) 28deg, transparent 44deg, transparent 138deg, rgba(59,130,246,.14) 148deg, transparent 162deg, transparent 258deg, rgba(37,99,235,.18) 268deg, transparent 284deg); }
  #briu-splash .bs-vignette { position: absolute; inset: 0; background: radial-gradient(80% 80% at 50% 50%, transparent 45%, rgba(5,9,20,.75) 100%); }

  /* centre stage */
  #briu-splash .bs-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px 70px; text-align: center; transition: opacity .4s ease, transform .6s cubic-bezier(.2,.7,.2,1); }

  #briu-splash .bs-emblem { position: relative; width: clamp(170px, 34vw, 230px); aspect-ratio: 1; margin-bottom: clamp(22px, 5vh, 40px); animation: bsPop .9s cubic-bezier(.2,.9,.2,1.1) .1s both; }
  #briu-splash .bs-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #briu-splash .bs-ring circle { fill: none; stroke-width: 2.5; }
  #briu-splash .bs-track { stroke: rgba(255,255,255,.12); }
  #briu-splash .bs-draw { stroke: var(--bs-sky); stroke-linecap: round; stroke-dasharray: 590.7; stroke-dashoffset: 590.7; animation: bsDraw 1.8s cubic-bezier(.65,0,.25,1) .3s forwards; filter: drop-shadow(0 0 6px rgba(59,130,246,.9)); }
  #briu-splash .bs-logo { position: absolute; inset: 17%; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 60px -10px rgba(37,99,235,.9); animation: bsBreathe 3.2s ease-in-out infinite; }
  #briu-splash .bs-logo img { width: 100%; height: 100%; object-fit: contain; }

  #briu-splash .bs-orbit { position: absolute; inset: 0; animation: bsSpin 9s linear infinite, bsFade .8s ease 1s both; }
  #briu-splash .bs-sat { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; display: grid; place-items: center; background: rgba(11,19,37,.85); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(6px); transform: rotate(var(--a)) translateY(calc(clamp(170px, 34vw, 230px) / -2 - 2px)); }
  #briu-splash .bs-sat svg { width: 22px; height: 22px; }

  #briu-splash .bs-title { font-family: 'Barlow Condensed', 'Barlow', system-ui, sans-serif; font-weight: 700; font-size: clamp(2.6rem, 9.5vw, 6.2rem); line-height: 1.04; letter-spacing: .01em; overflow: hidden; padding: 0 .04em .08em; white-space: nowrap; }
  #briu-splash .bs-title span { display: inline-block; transform: translateY(115%); animation: bsLetter .75s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
  #briu-splash .bs-title .bs-sp { width: .28em; }

  #briu-splash .bs-sub { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; font-size: clamp(.8rem, 2.4vw, 1.05rem); font-weight: 500; color: rgba(255,255,255,.78); opacity: 0; animation: bsFade .8s ease 1.9s forwards; }
  #briu-splash .bs-sub i { display: block; height: 2px; width: 0; background: var(--bs-blue); animation: bsLine .8s cubic-bezier(.2,.8,.2,1) 1.9s forwards; }
  #briu-splash .bs-sub i:last-child { animation-delay: 1.9s; }

  /* bottom: counter + bar + skip */
  #briu-splash .bs-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 clamp(18px, 4vw, 44px) 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; transition: opacity .35s ease; }
  #briu-splash .bs-count { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 700; line-height: .85; font-size: clamp(3.2rem, 9vw, 5.5rem); font-variant-numeric: tabular-nums; }
  #briu-splash .bs-count i { font-style: normal; font-size: .4em; color: var(--bs-sky); margin-left: 4px; }
  #briu-splash .bs-skip { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; font: 600 .85rem 'Barlow', sans-serif; cursor: pointer; backdrop-filter: blur(6px); transition: background .25s ease; }
  #briu-splash .bs-skip:hover { background: rgba(255,255,255,.14); }
  #briu-splash .bs-skip:focus-visible { outline: 2px solid var(--bs-sky); outline-offset: 3px; }
  #briu-splash .bs-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.1); }
  #briu-splash .bs-bar b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bs-blue), #93b4ff); transform: scaleX(0); transform-origin: left; box-shadow: 0 0 14px rgba(59,130,246,.9); }

  /* exit */
  #briu-splash.bs-out { pointer-events: none; }
  #briu-splash.bs-out .bs-stage { opacity: 0; transform: scale(1.08); }
  #briu-splash.bs-out .bs-fx, #briu-splash.bs-out .bs-foot { opacity: 0; }
  #briu-splash.bs-out .bs-top { transform: translateY(-101%); }
  #briu-splash.bs-out .bs-bot { transform: translateY(101%); }

  @keyframes bsSpin { to { transform: rotate(360deg); } }
  @keyframes bsDraw { to { stroke-dashoffset: 0; } }
  @keyframes bsPop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes bsFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bsLetter { to { transform: translateY(0); } }
  @keyframes bsLine { to { width: clamp(28px, 7vw, 64px); } }
  @keyframes bsBreathe { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    #briu-splash .bs-beams, #briu-splash .bs-orbit, #briu-splash .bs-glow, #briu-splash .bs-logo { animation: none; }
    #briu-splash .bs-title span { animation-duration: .01ms; animation-delay: 0s; }
  }
</style>

<script>
(function () {
  var splash = document.getElementById('briu-splash');
  var html = document.documentElement;
  if (!splash) return;
  if (html.classList.contains('bs-skip')) { splash.parentNode.removeChild(splash); return; }

  /* title letters */
  var title = document.getElementById('bs-title');
  var text = title.textContent; title.textContent = '';
  for (var i = 0; i < text.length; i++) {
    var s = document.createElement('span');
    if (text[i] === ' ') { s.className = 'bs-sp'; s.innerHTML = '&nbsp;'; }
    else { s.textContent = text[i]; }
    s.style.setProperty('--d', (0.95 + i * 0.045) + 's');
    title.appendChild(s);
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MIN = reduce ? 500 : 3400;   /* intro minimum time (ms) */
  var MAX = 9000;                  /* never block longer than this */
  var num = document.getElementById('bs-num');
  var fill = document.getElementById('bs-fill');
  var start = performance.now();
  var loaded = document.readyState === 'complete';
  var p = 0, done = false, raf;

  window.addEventListener('load', function () { loaded = true; });

  function finish() {
    if (done) return; done = true;
    cancelAnimationFrame(raf);
    num.textContent = '100'; fill.style.transform = 'scaleX(1)';
    try { sessionStorage.setItem('briuIntro', '1'); } catch (e) {}
    splash.classList.add('bs-out');
    setTimeout(function () {
      html.classList.remove('bs-lock');
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 1350);
  }

  function tick(t) {
    var el = t - start;
    var target = loaded ? 100 : Math.min(88, (el / MIN) * 88);
    if (el < MIN) target = Math.min(target, (el / MIN) * 100);   /* progress cannot outrun the intro timeline */
    p += (target - p) * 0.09;
    if (target >= 100 && p > 99.4) p = 100;
    num.textContent = Math.round(p);
    fill.style.transform = 'scaleX(' + (p / 100) + ')';
    if ((p >= 100 && el >= MIN) || el >= MAX) { finish(); return; }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  document.getElementById('bs-skip').addEventListener('click', finish);
})();
</script>
